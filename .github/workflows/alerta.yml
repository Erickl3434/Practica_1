name: Notificacion Push a Main

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v3

      - name: Ejecutar el programa Hola Mundo
        run: node app.js

      - name: Enviar notificacion a ntfy.sh
        run: |
          curl -H "Title: Despliegue Exitoso" \
               -H "Priority: default" \
               -H "Tags: rocket,heavy_check_mark" \
               -d "Se ha subido un nuevo cambio a la rama main del repositorio Practica_1." \
               https://ntfy.sh/devops-itla